- name: 🍪 Настраиваем Фабрику Печенек
  hosts: all
  gather_facts: true
  become: true  # 🔹 Исправлено: yes → true
  tasks:
    - name: Приветствие
      ansible.builtin.debug:  # 🔹 Исправлено: добавлено полное имя
        msg: "🏭 Фабрика '{{ factory_name }}' | Печей: {{ oven_count }} 🍪"

    - name: Устанавливаем печи (Nginx)
      ansible.builtin.apt:  # 🔹 Тоже полное имя (хотя линтер не ругался)
        name: nginx
        state: present
        update_cache: false  # 🔹 no → false

    - name: Вешаем меню на дверь
      ansible.builtin.copy:
        content: |
          <h1>🍪 Фабрика {{ factory_name }}</h1>
          <p>🔥 Печей: {{ oven_count }}</p>
          <p>⏰ Построена: {{ built_at }}</p>
          <p>✅ Всё работает!</p>
        dest: /var/www/html/index.html
        mode: '0644'
      notify: Перезапустить сервер

  handlers:
    - name: Перезапустить сервер
      ansible.builtin.systemd:
        name: nginx
        state: restarted
