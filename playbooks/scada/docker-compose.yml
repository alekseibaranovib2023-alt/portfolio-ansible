# 🏭 SCADA-система: Node-RED + InfluxDB + Grafana + Mosquitto
# Запуск: docker compose up -d
# Остановка: docker compose down

services:
  # 🧠 МОЗГ: Node-RED (визуальный редактор SCADA)
  nodered:
    image: nodered/node-red:latest
    container_name: scada-nodered
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
    environment:
      - TZ=Europe/Moscow
    depends_on:
      - influxdb
      - mosquitto
    restart: unless-stopped

  # 💾 ПАМЯТЬ: InfluxDB (временная база данных)
  influxdb:
    image: influxdb:2.7
    container_name: scada-influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=scada
      - DOCKER_INFLUXDB_INIT_BUCKET=telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=supersecrettoken123
    restart: unless-stopped

  # 👀 ГЛАЗА: Grafana (дашборды и графики)
  grafana:
    image: grafana/grafana:latest
    container_name: scada-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - influxdb
    restart: unless-stopped

  # 📡 НЕРВЫ: Mosquitto (MQTT-брокер)
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: scada-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

volumes:
  nodered_data:
  influxdb_data:
  grafana_data:
  mosquitto_data:
  mosquitto_log:
