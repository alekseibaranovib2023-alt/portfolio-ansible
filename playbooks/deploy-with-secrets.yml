- name: Деплой с безопасными секретами
  hosts: localhost
  gather_facts: false
  vars_files:
    - secrets.yml  # 🔐 Ansible сам расшифрует этот файл при запуске
  
  tasks:
    - name: Создаём файл конфигурации с паролем
      ansible.builtin.copy:
        content: |
          DB_HOST=localhost
          DB_USER=admin
          DB_PASS={{ db_password }}
        dest: /tmp/app.env
        mode: '0600'  # 🔒 Чтение только для владельца (безопасность!)
      no_log: true    # 🤫 ГЛАВНОЕ: скрываем содержимое из вывода Ansible

    - name: Проверяем, что файл создан (без показа пароля)
      ansible.builtin.command: cat /tmp/app.env
      register: env_content
      no_log: true    # 🤫 Скрываем и результат команды

    - name: Подтверждаем успех
      ansible.builtin.debug:
        msg: "✅ Конфигурационный файл создан безопасно. Права: 0600"
