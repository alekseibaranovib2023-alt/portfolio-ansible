apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cookie-factory
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alekseibaranovib2023-alt/portfolio-ansible.git
    targetRevision: HEAD
    path: k8s # Папка с твоими манифестами
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated: # 🪄 МАГИЯ: само синхронизирует изменения!
      prune: true
      selfHeal: true
